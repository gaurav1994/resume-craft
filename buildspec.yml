version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24.18.1
    commands:
      - echo "Preparing static production deployment"
      - test -n "$S3_BUCKET"
      - test -n "$AWS_REGION"
      - npm install

  build:
    commands:
      - npm run build:prod

artifacts:
  files:
    - 'dist/**/*'
    - 'public/**/*'
  discard-paths: no
